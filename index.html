<!DOCTYPE html>
<html lang="tr" data-theme="purple">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purpleguy | Personal Profile & Links</title>
  
  <!-- PWA ve Meta Etiketleri -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0d0a1a">
  <meta name="description" content="Purpleguy (SGM) Developer & Modder Personal Cyber-Neon Profile">
  <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">

  <!-- Font Awesome İkonları -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Ana Stil Dosyası -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Arka Plan Easter Egg Gizli Şarkısı -->
  <audio id="easterSong" src="assets/audio/easter-song.mp3" preload="auto" loop></audio>

  <!-- Ust Araç Çubuğu (Tema Seçici ve Dil Butonu) -->
  <header class="top-bar">
    <div class="theme-switch-container">
      <button class="icon-btn" onclick="toggleThemePanel()" title="Tema Seç">
        <i class="fa-solid fa-palette"></i>
      </button>
      
      <!-- 10 Neon Tema Paneli -->
      <div id="themePicker" class="theme-picker-panel">
        <button class="theme-opt purple" onclick="setTheme('purple')" title="Purple Neon"></button>
        <button class="theme-opt cyan" onclick="setTheme('cyan')" title="Cyber Cyan"></button>
        <button class="theme-opt green" onclick="setTheme('green')" title="Matrix Green"></button>
        <button class="theme-opt red" onclick="setTheme('red')" title="Crimson Red"></button>
        <button class="theme-opt gold" onclick="setTheme('gold')" title="Gold Cyber"></button>
        <button class="theme-opt pink" onclick="setTheme('pink')" title="Hot Pink"></button>
        <button class="theme-opt blue" onclick="setTheme('blue')" title="Deep Blue"></button>
        <button class="theme-opt orange" onclick="setTheme('orange')" title="Neon Orange"></button>
        <button class="theme-opt lime" onclick="setTheme('lime')" title="Acid Lime"></button>
        <button class="theme-opt dark" onclick="setTheme('dark')" title="Pitch Black"></button>
      </div>
    </div>

    <!-- Dil Değiştirme Butonu -->
    <button class="icon-btn lang-btn" onclick="toggleLanguage()" title="Language / Dil">
      <i class="fa-solid fa-globe"></i>
      <span id="langBtnText">EN</span>
    </button>
  </header>

  <!-- Ana İçerik Kapsayıcısı -->
  <main class="container">
    
    <!-- Profil Başlığı ve Avatarlar -->
    <section class="profile-header">
      <div class="avatar-wrapper">
        <img src="assets/images/icon-192.png" alt="Purpleguy Profile" class="profile-avatar">
      </div>
      
      <!-- Easter Egg Tetikleyicisi (5 Kez Dokunma) -->
      <h1 id="profileTitle" onclick="registerTap()" style="cursor: pointer; user-select: none; -webkit-user-select: none;" data-tr="Purpleguy" data-en="Purpleguy">Purpleguy</h1>
      
      <p class="bio" data-tr="Geliştirici & Minecraft Bedrock Modder | SGM" data-en="Developer & Minecraft Bedrock Modder | SGM">Geliştirici & Minecraft Bedrock Modder | SGM</p>
    </section>

    <!-- Sosyal Bağlantılar ve Linkler -->
    <section class="links-section">
      <a href="https://github.com/guest666-code" target="_blank" rel="noopener noreferrer" class="link-card">
        <i class="fa-brands fa-github"></i>
        <span>GitHub</span>
      </a>

      <a href="https://www.curseforge.com/members/purpleguy198716/projects" target="_blank" rel="noopener noreferrer" class="link-card">
        <i class="fa-solid fa-cube"></i>
        <span>CurseForge (Minecraft Add-ons)</span>
      </a>

      <a href="https://youtube.com" target="_blank" rel="noopener noreferrer" class="link-card">
        <i class="fa-brands fa-youtube"></i>
        <span>YouTube</span>
      </a>

      <a href="https://discord.gg/M8rZKSXvVm" target="_blank" rel="noopener noreferrer" class="link-card">
        <i class="fa-brands fa-discord"></i>
        <span>Discord Sunucumuz</span>
      </a>
    </section>

    <!-- Alt Bilgi (Footer) -->
    <footer class="footer">
      <p>© 2026 Purpleguy (SGM). MIT License.</p>
    </footer>

  </main>

  <!-- 3dk 36sn Sonra Açılacak Bembeyaz 404 Ekranı -->
  <div id="errorScreen" class="error-screen">
    <div class="error-content">
      <h1>404</h1>
      <p data-tr="SİSTEM ÇÖKTÜ: Baglantı Kesildi" data-en="SYSTEM CRASH: Connection Lost">SİSTEM ÇÖKTÜ: Bağlantı Kesildi</p>
    </div>
  </div>

  <!-- JavaScript Kod Dosyası -->
  <script src="assets/js/main.js"></script>
  
  <!-- PWA Service Worker Kaydı -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW Kayıtlı:', reg.scope))
          .catch(err => console.log('SW Hata:', err));
      });
    }
  </script>
</body>
</html>
