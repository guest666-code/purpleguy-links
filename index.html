<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Purpleguy | Sosyal Medya & Profiller</title>

  <!-- Favicon -->
  <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon" />

  <!-- FontAwesome İkon Kütüphanesi -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Özel CSS -->
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <div class="container">
    <!-- Üst Kontrol Butonları (Tema ve Dil) -->
    <div class="header-actions">
      <!-- Tema Seçim Paneli Açma Butonu -->
      <button class="theme-toggle" id="themeBtn" onclick="toggleThemePanel()" title="Tema Değiştir">
        <i class="fa-solid fa-palette"></i>
      </button>

      <!-- Dil Değiştirici -->
      <button class="lang-toggle" id="langBtn" onclick="toggleLanguage()" title="Dil Değiştir">
        <i class="fa-solid fa-globe"></i> <span id="langBtnText">EN</span>
      </button>
    </div>

    <div class="profile-header">
      <h1>Purpleguy</h1>
      <p id="subTitle">Developer & Modder • SGM</p>
    </div>

    <!-- 10 Renkli Tema Seçim Paneli (Palet Butonuna Tıklanınca Açılır) -->
    <div class="theme-picker-panel" id="themePicker">
      <div class="theme-dot" style="background: #a855f7;" onclick="setTheme('purple')" title="Mor (Purple)"></div>
      <div class="theme-dot" style="background: #06b6d4;" onclick="setTheme('cyber-cyan')" title="Siyan (Cyan)"></div>
      <div class="theme-dot" style="background: #22c55e;" onclick="setTheme('matrix-green')" title="Matrix Yeşili"></div>
      <div class="theme-dot" style="background: #f43f5e;" onclick="setTheme('crimson-red')" title="Kırmızı (Crimson)"></div>
      <div class="theme-dot" style="background: #f97316;" onclick="setTheme('sunset-orange')" title="Gün Batımı (Sunset)"></div>
      <div class="theme-dot" style="background: #eab308;" onclick="setTheme('gold-amber')" title="Altın (Gold)"></div>
      <div class="theme-dot" style="background: #ec4899;" onclick="setTheme('hot-pink')" title="Pembe (Pink)"></div>
      <div class="theme-dot" style="background: #3b82f6;" onclick="setTheme('ocean-blue')" title="Okyanus Mavisi"></div>
      <div class="theme-dot" style="background: #10b981;" onclick="setTheme('emerald-mint')" title="Zümrüt (Emerald)"></div>
      <div class="theme-dot" style="background: #e4e4e7;" onclick="setTheme('dark-monochrome')" title="Monokrom (Gri)"></div>
    </div>

    <div class="links-section">
      <!-- Rscripts Embed Kartı -->
      <div class="embed-card">
        <a href="https://rscripts.net/user/Purpleguy198716" target="_blank" rel="noopener noreferrer">
          <img alt="Purpleguy198716 on Rscripts" loading="lazy" width="360" height="132" src="https://rscripts.net/api/embed/user/Purpleguy198716?theme=dark" />
        </a>
      </div>

      <!-- GitHub Embed Kartı -->
      <div class="embed-card">
        <div class="iframely-embed">
          <div class="iframely-responsive" style="height: 140px; padding-bottom: 0;">
            <a href="https://github.com/guest666-code" data-iframely-url="https://iframely.net/eHjI6u8M?theme=dark"></a>
          </div>
        </div>
      </div>

      <!-- YouTube Embed Kartı -->
      <div class="embed-card">
        <div class="iframely-embed">
          <div class="iframely-responsive" style="height: 140px; padding-bottom: 0;">
            <a href="https://www.youtube.com/@efemert2128" data-iframely-url="https://iframely.net/jCm3jVI4?theme=dark"></a>
          </div>
        </div>
      </div>

      <!-- CurseForge Embed Kartı -->
      <div class="embed-card">
        <div class="iframely-embed">
          <div class="iframely-responsive" style="height: 140px; padding-bottom: 0;">
            <a href="https://www.curseforge.com/members/purpleguy198716/projects" data-iframely-url="https://iframely.net/gVGlgRUe?theme=dark"></a>
          </div>
        </div>
      </div>

      <!-- Discord Sunucusu Embed Kartı -->
      <div class="embed-card">
        <div class="iframely-embed">
          <div class="iframely-responsive" style="height: 140px; padding-bottom: 0;">
            <a href="https://discord.com/invite/M8rZKSXvVm" data-iframely-url="https://iframely.net/xp7s4foK?theme=dark"></a>
          </div>
        </div>
      </div>

      <!-- GitHub Gist (En Altta Sade Buton Olarak) -->
      <a href="https://gist.github.com/guest666-code" target="_blank" class="link-btn gist" style="margin-top: 5px;">
        <i class="fa-solid fa-code"></i>
        <span class="btn-text" data-tr="GitHub Gists (Kodlarım)" data-en="GitHub Gists (Code Snippets)">GitHub Gists (Kodlarım)</span>
      </a>
    </div>

    <div class="footer">
      © 2026 Purpleguy • SGM
    </div>
  </div>

  <!-- Iframely Asenkron Embed Scripti -->
  <script async src="https://iframely.net/embed.js"></script>

  <!-- Özel JS -->
  <script src="assets/js/main.js"></script>
</body>
</html>
